plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Empty: Fabric Loom implicitly adds the repositories it needs (Fabric's maven,
// Mojang's libraries, Maven Central) for the minecraft/fabric-loader/fabric-api/
// gson/junit dependencies below.
repositories {
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // NOTE: Config.java uses com.google.gson.* without an explicit dependency here.
    // Loom already puts Gson on the compile/runtime classpath (Minecraft depends on
    // it), so it "just works" — but that means the version compiled against is
    // whatever version Mojang currently ships, not something this build pins.
    // A pinned `compileOnly` dependency was tried and rejected: Gradle's conflict
    // resolution always picks the higher of the two versions in play, so a pin
    // below Minecraft's current version doesn't actually control what's compiled
    // against — it only creates a second, misleading source of truth. If Minecraft
    // ever drops Gson, this will fail to compile and needs a real dependency.

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    var replaceProperties = [
            mod_id         : mod_id,
            mod_name       : mod_name,
            mod_license    : mod_license,
            mod_version    : mod_version,
            mod_authors    : mod_authors,
            mod_description: mod_description,
            loader_version : loader_version,
            minecraft_version: minecraft_version,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'     : project.mod_id,
            'Specification-Vendor'    : project.mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.mod_version,
            'Implementation-Vendor'   : project.mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
